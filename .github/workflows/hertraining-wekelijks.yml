name: Wekelijkse hertraining
on:
  schedule:
    - cron: "17 3 * * 1"      # elke maandag 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hertrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy "scikit-learn>=1.8,<1.9" scipy

      - name: Modellenmap zoeken
        id: zoek
        run: |
          pad=$(find . -name deel9_wekelijks.py -not -path './.git/*' -print -quit)
          if [ -z "$pad" ]; then
            echo "::error::deel9_wekelijks.py niet gevonden. Staat de map weerbot-modellen wel in de repository?"
            exit 1
          fi
          map=$(dirname "$pad")
          echo "gevonden in: $map"
          echo "map=$map" >> "$GITHUB_OUTPUT"

      - name: Data bijwerken en modellen hertrainen
        working-directory: ${{ steps.zoek.outputs.map }}
        run: python deel9_wekelijks.py

      - name: Wijzigingen committen
        run: |
          m="${{ steps.zoek.outputs.map }}"
          git config user.name "weerbot-actie"
          git config user.email "actions@users.noreply.github.com"
          git add "$m/uit_features" "$m/klim_features.csv" \
                  "$m/modellen/modellen.json" "$m/modellen/pooled_gbm.pkl"
          git diff --cached --quiet || git commit -m "Wekelijkse hertraining"
          git push
